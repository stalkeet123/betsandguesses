name: Classic sync checks

on:
  push:
    branches: [fix/web-classic-sync-audio]

permissions:
  contents: read

concurrency:
  group: classic-sync-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install Flutter stable
        run: |
          git clone --depth 1 --branch stable https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Resolve dependencies
        run: flutter pub get
      - name: Format changed Dart files
        if: ${{ !cancelled() }}
        run: |
          dart format lib/features/game/screens/game_screen.dart lib/features/game/services/game_service.dart lib/features/game/services/game_sync_policy.dart lib/features/game/widgets/classic_question_stage.dart test/features/game/services/game_sync_policy_test.dart test/features/game/services/classic_sync_transport_test.dart test/features/game/widgets/classic_question_stage_test.dart
          git diff --exit-code -- '*.dart'
      - name: Analyze (existing warnings are nonfatal)
        if: ${{ !cancelled() }}
        run: flutter analyze --no-fatal-infos --no-fatal-warnings
      - name: Classic synchronization and presentation tests
        if: ${{ !cancelled() }}
        run: flutter test test/features/game/services test/features/game/widgets/classic_question_stage_test.dart --reporter expanded
      - name: Web release compilation
        if: ${{ !cancelled() }}
        run: flutter build web --release
