  <style id="splash-screen-style">
    html {
      height: 100%;
      overscroll-behavior: none;
    }

    body {
      margin: 0;
      min-height: 100%;
      background-color: #0F0805;
      background-size: 100% 100%;
      overscroll-behavior: none;
      touch-action: none;
      outline: none;
    }

    flt-glass-pane,
    canvas {
      outline: none !important;
      -webkit-tap-highlight-color: transparent;
    }

    .center {
      margin: 0;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    .contain {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    .stretch {
      display: block;
      width: 100%;
      height: 100%;
    }

    .cover {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .bottom {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translate(-50%, 0);
    }

    .bottomLeft {
      position: absolute;
      bottom: 0;
      left: 0;
    }

    .bottomRight {
      position: absolute;
      bottom: 0;
      right: 0;
    }

    @media (prefers-color-scheme: dark) {
      body { background-color: #0F0805; }
    }
  </style>

  <script id="splash-screen-script">
    function removeSplashFromWeb() {
      document.getElementById("splash")?.remove();
      document.getElementById("splash-branding")?.remove();
      document.body.style.background = "#0F0805";
    }

    let wakeLockSentinel = null;

    async function acquireWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLockSentinel = await navigator.wakeLock.request('screen');
          wakeLockSentinel.addEventListener('release', () => {
            wakeLockSentinel = null;
          });
        }
      } catch (err) {
        // WakeLock may be unavailable or blocked by the browser.
      }
    }

    const unlockWakeLock = () => acquireWakeLock();
    window.addEventListener('touchstart', unlockWakeLock, { passive: true });
    window.addEventListener('click', unlockWakeLock, { passive: true });

    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') acquireWakeLock();
    });
  </script>
</head>
