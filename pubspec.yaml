name: witsgame
description: "Bets & Guesses party quiz and betting game"
publish_to: 'none'
version: 1.0.9+12

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Supabase
  supabase_flutter: ^2.9.0

  # State Management
  flutter_riverpod: ^3.3.1

  # Routing
  go_router: ^14.8.1

  # Utils
  uuid: ^4.5.1
  qr_flutter: ^4.1.0
  google_fonts: ^6.2.1
  confetti: ^0.8.0
  flutter_animate: ^4.5.2
  flutter_soloud: ^2.1.2
  shared_preferences: ^2.5.3
  collection: ^1.19.1
  purchases_flutter: ^10.2.3
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  fonts:
    - family: RehnCondensed
      fonts:
        - asset: assets/Rehn Condensed W03 ExtraBold.ttf
  assets:
    - assets/
    - assets/sound/

flutter_icons:
  android: true
  ios: true
  image_path: "assets/logo.webp"
  remove_alpha_ios: true
